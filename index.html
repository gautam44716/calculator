<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator | Gautam Parihar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="../../index.html#projects" class="back-link">&larr; Back to Portfolio</a>

  <div class="app-card calculator">
    <h2 class="app-title">Calculator</h2>

    <!-- Display -->
    <div class="display">
      <div id="history" class="history"></div>
      <div id="screen" class="screen">0</div>
    </div>

    <!-- Buttons -->
    <div class="keys">
      <button class="key key-clear" data-action="clear">C</button>
      <button class="key key-clear" data-action="delete">DEL</button>
      <button class="key key-op" data-action="percent">%</button>
      <button class="key key-op" data-action="operator" data-value="/">&divide;</button>

      <button class="key" data-action="number" data-value="7">7</button>
      <button class="key" data-action="number" data-value="8">8</button>
      <button class="key" data-action="number" data-value="9">9</button>
      <button class="key key-op" data-action="operator" data-value="*">&times;</button>

      <button class="key" data-action="number" data-value="4">4</button>
      <button class="key" data-action="number" data-value="5">5</button>
      <button class="key" data-action="number" data-value="6">6</button>
      <button class="key key-op" data-action="operator" data-value="-">&minus;</button>

      <button class="key" data-action="number" data-value="1">1</button>
      <button class="key" data-action="number" data-value="2">2</button>
      <button class="key" data-action="number" data-value="3">3</button>
      <button class="key key-op" data-action="operator" data-value="+">+</button>

      <button class="key key-zero" data-action="number" data-value="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key-equal" data-action="equals">=</button>
    </div>
  </div>

  <p class="page-footer">
    Source code on <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
  </p>

  <script src="script.js"></script>
</body>

</html>
